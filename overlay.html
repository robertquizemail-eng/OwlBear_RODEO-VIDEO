<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webcam Overlay</title>
  <style>
    /* Fully transparent, click-through layer covering the whole screen. */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
    #dbg { position: fixed; left: 8px; bottom: 8px; font: 11px monospace; color: #fff;
           background: rgba(0,0,0,.65); padding: 2px 6px; border-radius: 4px; pointer-events: none; z-index: 10; }
    .tile { position: absolute; left: 0; top: 0; pointer-events: none; display: none; }
    .tile img { width: 100%; height: 100%; object-fit: cover; display: block; box-sizing: border-box;
                border: 2px solid #bb99ff; border-radius: 6px; background: #000; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="dbg">webcam layer: starting...</div>

  <script type="module">
    import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";

    const CHANNEL = "com.example.webcam-tokens/frame"; // webcam frames (broadcast)
    const META = "com.example.webcam-tokens/tile";     // marks a webcam placeholder on the board
    const STALE_MS = 3000;                             // hide a tile if no frame for 3s

    const root = document.getElementById("root");
    const dbg = document.getElementById("dbg"); // small status badge (bottom-left) for troubleshooting
    let rx = 0;               // frames received
    let gridDpi = 150;        // scene grid size in board units per cell
    const frames = new Map(); // playerId -> { frame, at }
    const tiles = new Map();  // placeholder item id -> { el, img, src }
    let placeholders = [];    // current webcam placeholder items in the scene

    OBR.onReady(() => {
      // Latest webcam frame for each player (the sender's popover broadcasts to ALL, incl. us).
      OBR.broadcast.onMessage(CHANNEL, (event) => {
        const { playerId, frame, stop } = event.data;
        rx++;
        if (stop) frames.delete(playerId);
        else if (frame) frames.set(playerId, { frame, at: Date.now() });
      });

      // Keep track of the placeholders (normal shared board items players can drag).
      const setItems = (items) => {
        placeholders = items.filter((i) => i.metadata && i.metadata[META]);
      };
      const load = () => {
        OBR.scene.grid.getDpi().then((d) => (gridDpi = d)).catch(() => {});
        OBR.scene.items.getItems().then(setItems);
      };
      OBR.scene.isReady().then((ready) => ready && load());
      OBR.scene.onReadyChange((ready) => (ready ? load() : (placeholders = [])));
      OBR.scene.items.onChange(setItems);

      loop();
    });

    // There is no "viewport changed" event, so we poll every animation frame.
    async function loop() {
      try {
        // Where the board origin and the point (1,0) land on screen -> origin + pixels per board unit.
        const [o, u] = await Promise.all([
          OBR.viewport.transformPoint({ x: 0, y: 0 }),
          OBR.viewport.transformPoint({ x: 1, y: 0 }),
        ]);
        render(o, u.x - o.x);
        dbg.textContent = `webcam layer OK | frames rx: ${rx} | players: ${frames.size} | frames on board: ${placeholders.length} | scale: ${(u.x - o.x).toFixed(2)}`;
      } catch (e) {
        dbg.textContent = "webcam layer error: " + (e?.error?.message || e?.message || String(e));
      }
      requestAnimationFrame(loop);
    }

    function makeTile() {
      const el = document.createElement("div");
      el.className = "tile";
      const img = document.createElement("img");
      el.append(img);
      root.appendChild(el);
      return { el, img, src: "" };
    }

    // Size/position of the video area for a placeholder, in BOARD units.
    // For an image token the video fills the top square of the image; the strip below it
    // stays visible so other extensions (Stat Bubbles) can draw their bars there.
    // How the webcam sits inside the frame, as fractions of the frame's width.
    // Change these two numbers to resize / reposition the video inside the frame:
    //   VIDEO_INSET: gap between the frame edge and the video (left, top)
    //   VIDEO_SIZE:  width and height of the video (it is always square)
    // Left/top gap + size + right/bottom gap must add up to 1.
    const VIDEO_INSET = 28 / 256;  // ~11% gap on every side
    const VIDEO_SIZE = 200 / 256;  // ~78% of the frame

    function geometry(item) {
      if (item.type === "IMAGE") {
        const k = gridDpi / item.grid.dpi;          // image pixels -> board units
        const sx = k * item.scale.x, sy = k * item.scale.y;
        const iw = item.image.width;
        return {
          w: VIDEO_SIZE * iw * sx,                  // square video area inside the frame
          h: VIDEO_SIZE * iw * sy,
          dx: VIDEO_INSET * iw * sx,                // video's top-left corner inside the image
          dy: VIDEO_INSET * iw * sy,
          ox: item.grid.offset.x * sx,              // rotation/anchor point inside the image
          oy: item.grid.offset.y * sy,
        };
      }
      // Older shape placeholder: the whole shape, anchored at its top-left corner.
      return { w: item.width * item.scale.x, h: item.height * item.scale.y, dx: 0, dy: 0, ox: 0, oy: 0 };
    }

    function render(origin, scale) {
      const now = Date.now();
      const seen = new Set();

      for (const item of placeholders) {
        seen.add(item.id);
        let t = tiles.get(item.id);
        if (!t) tiles.set(item.id, (t = makeTile()));

        const f = frames.get(item.metadata[META].playerId);
        if (!f || now - f.at > STALE_MS || item.visible === false) {
          t.el.style.display = "none"; // no live video: the plain placeholder shows through
          continue;
        }

        const g = geometry(item);
        // item.position is the anchor point; the image's top-left is the anchor minus the offset,
        // and the video starts (dx, dy) in from that corner.
        const x = origin.x + (item.position.x - g.ox + g.dx) * scale;
        const y = origin.y + (item.position.y - g.oy + g.dy) * scale;
        t.el.style.display = "block";
        t.el.style.width = g.w * scale + "px";
        t.el.style.height = g.h * scale + "px";
        // Rotate about the token's anchor point (expressed relative to the video tile).
        t.el.style.transformOrigin = `${(g.ox - g.dx) * scale}px ${(g.oy - g.dy) * scale}px`;
        t.el.style.transform = `translate(${x}px, ${y}px) rotate(${item.rotation}deg)`;
        if (t.src !== f.frame) { t.img.src = f.frame; t.src = f.frame; }
      }

      // Remove tiles whose placeholder was deleted.
      for (const [id, t] of tiles) {
        if (!seen.has(id)) { t.el.remove(); tiles.delete(id); }
      }
    }
  </script>
</body>
</html>
