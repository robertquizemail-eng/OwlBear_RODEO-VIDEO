<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webcam Tokens</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 12px; color: #fff; background: #222639; }
    button { width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 6px; border: 0; font-size: 14px;
             background: #bb99ff; color: #222639; font-weight: bold; cursor: pointer; }
    button.live { background: #ff6b6b; }
    button.secondary { background: #3b4060; color: #fff; font-weight: normal; }
    #status { font-size: 12px; opacity: .85; min-height: 16px; margin-top: 4px; }
  </style>
</head>
<body>
  <button id="addBtn">1. Add My Webcam Frame</button>
  <button id="camBtn">2. Start Camera</button>
  <button id="removeBtn" class="secondary">Remove My Frame</button>
  <button id="reloadBtn" class="secondary">Reload Webcam Layer</button>
  <div id="status"></div>

  <script type="module">
    import OBR, { buildImage } from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";

    // ---- Config -------------------------------------------------------------
    const CHANNEL = "com.example.webcam-tokens/frame"; // webcam frames (broadcast)
    const META = "com.example.webcam-tokens/tile";     // marks a webcam placeholder on the board
    const MODAL_ID = "com.example.webcam-tokens/overlay";
    const SIZE = 128;      // capture resolution (SIZE x SIZE)
    const FPS = 10;        // frames per second
    const QUALITY = 0.3;   // JPEG quality (0-1)

    // The placeholder is a REAL image token (frame.png, hosted next to this page) so other
    // token extensions such as Stat Bubbles treat it like any other token.
    // frame.png is 256x320: a 256x256 area for the webcam plus a 64px strip underneath
    // where Stat Bubbles can draw its health bar without being covered by the video.
    const FRAME_URL = new URL("frame.png", location.href).href;
    const FRAME_W = 256, FRAME_H = 320;
    const FRAME_CELLS = 2; // how many grid cells wide the frame is on the board

    const btn = document.getElementById("camBtn");
    const statusEl = document.getElementById("status");
    const setStatus = (t) => (statusEl.textContent = t);

    let myId = null;
    let popup = null;       // camera pop-out window
    let watchTimer = null;
    let sent = 0;

    OBR.onReady(() => { myId = OBR.player.id; });

    // ---- 1. Placeholder: a normal shared token players can drag -------------
    async function addFrame() {
      const mine = await OBR.scene.items.getItems((i) => i.metadata?.[META]?.playerId === myId);
      if (mine.length) return setStatus("You already have a frame. Drag it around the board.");

      // Drop it in the middle of what you are currently looking at.
      const center = await OBR.viewport.inverseTransformPoint({
        x: (await OBR.viewport.getWidth()) / 2,
        y: (await OBR.viewport.getHeight()) / 2,
      });
      const name = await OBR.player.getName();

      // dpi = 256 means "256 image pixels per grid cell", so scale 1 is one cell wide
      // and scale FRAME_CELLS is FRAME_CELLS cells wide, whatever the scene's grid size.
      const item = buildImage(
        { width: FRAME_W, height: FRAME_H, mime: "image/png", url: FRAME_URL },
        { dpi: 256, offset: { x: FRAME_W / 2, y: FRAME_H / 2 } }
      )
        .scale({ x: FRAME_CELLS, y: FRAME_CELLS })
        .position(center)
        .layer("CHARACTER")   // a normal token on the Character layer
        .name(name)
        .metadata({ [META]: { playerId: myId } })
        .build();
      await OBR.scene.items.addItems([item]);
      setStatus("Frame added. Now click Start Camera.");
    }

    async function removeFrame() {
      const mine = await OBR.scene.items.getItems((i) => i.metadata?.[META]?.playerId === myId);
      await OBR.scene.items.deleteItems(mine.map((i) => i.id));
      setStatus(mine.length ? "Frame removed." : "You have no frame.");
    }

    // ---- 2. Relay: camera pop-out window -> everyone ------------------------
    window.addEventListener("message", (e) => {
      if (!popup || e.source !== popup) return; // only trust our own pop-out
      const msg = e.data;
      if (!msg) return;
      if (msg.type === "ready") {
        popup.postMessage({ type: "config", size: SIZE, fps: FPS, quality: QUALITY }, "*");
      } else if (msg.type === "frame") {
        sent++;
        if (sent % 20 === 0) setStatus("Live. Frames sent: " + sent);
        // "ALL" = every other player AND our own overlay on this screen.
        OBR.broadcast.sendMessage(CHANNEL, { playerId: myId, frame: msg.frame }, { destination: "ALL" });
      }
    });

    function openCamera() {
      sent = 0;
      // Must be called directly from the click so the browser allows the popup.
      popup = window.open(new URL("camera.html", location.href).href, "obr-webcam", "width=280,height=360");
      if (!popup) return setStatus("Popup blocked. Allow popups for this site and try again.");
      btn.textContent = "Stop Camera";
      btn.classList.add("live");
      setStatus("Camera window opened. Click Start Camera in it.");
      watchTimer = setInterval(() => { if (popup.closed) stopCamera(); }, 1000);
    }

    function stopCamera() {
      clearInterval(watchTimer);
      if (popup && !popup.closed) popup.close();
      popup = null;
      OBR.broadcast.sendMessage(CHANNEL, { playerId: myId, stop: true }, { destination: "ALL" });
      btn.textContent = "2. Start Camera";
      btn.classList.remove("live");
      setStatus("Camera stopped.");
    }

    // ---- Webcam layer (normally opened by the background page) -------------
    async function reloadLayer() {
      try { await OBR.modal.close(MODAL_ID); } catch (e) { /* wasn't open */ }
      try {
        await OBR.modal.open({
          id: MODAL_ID,
          url: new URL("overlay.html", location.href).href,
          fullScreen: true, hideBackdrop: true, hidePaper: true, disablePointerEvents: true,
        });
        setStatus("Webcam layer reloaded.");
      } catch (e) {
        setStatus("Could not open webcam layer: " + (e?.error?.message || e?.message || e));
      }
    }

    const run = (fn) => () => fn().catch((e) => setStatus("Error: " + (e?.error?.message || e?.message || e)));
    document.getElementById("addBtn").addEventListener("click", run(addFrame));
    document.getElementById("removeBtn").addEventListener("click", run(removeFrame));
    document.getElementById("reloadBtn").addEventListener("click", run(reloadLayer));
    btn.addEventListener("click", () => (popup ? stopCamera() : openCamera()));
  </script>
</body>
</html>
