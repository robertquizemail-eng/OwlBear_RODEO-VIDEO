<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webcam Tokens</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 12px; color: #fff; background: #222639; }
    label { display: block; font-size: 12px; margin-bottom: 4px; opacity: .8; }
    select, button { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 6px; border: 0; font-size: 14px; }
    button { background: #bb99ff; color: #222639; font-weight: bold; cursor: pointer; }
    button.live { background: #ff6b6b; }
    #status { font-size: 12px; opacity: .8; min-height: 16px; }
  </style>
</head>
<body>
  <label for="tokenSelect">Select My Token</label>
  <select id="tokenSelect"></select>

  <button id="camBtn">Start Camera</button>
  <div id="status"></div>

  <!-- Hidden capture surface + video element (never shown to the user) -->
  <canvas id="canvas" width="128" height="128" style="display:none"></canvas>
  <video id="video" autoplay playsinline muted style="display:none"></video>

  <script type="module">
    // The SDK ships as an ES module; this CDN build works in a plain <script type="module"> tag.
    import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";

    // ---- Config -------------------------------------------------------------
    const CHANNEL = "com.example.webcam-tokens/frame"; // broadcast channel name
    const SIZE = 128;      // capture resolution (SIZE x SIZE)
    const FPS = 10;        // frames per second
    const QUALITY = 0.3;   // JPEG quality (0-1); low = small messages = low latency

    // ---- DOM ----------------------------------------------------------------
    const select = document.getElementById("tokenSelect");
    const btn = document.getElementById("camBtn");
    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const video = document.getElementById("video");

    // ---- State --------------------------------------------------------------
    let myId = null;          // this player's Owlbear ID
    let stream = null;        // MediaStream from the webcam
    let timer = null;         // setInterval handle for the capture loop
    let activeTokenId = null; // token currently being streamed
    const originalUrls = new Map(); // tokenId -> original image URL (to restore later)
    const busy = new Set();         // tokenIds with an update in flight (drop frames instead of queueing)

    const setStatus = (t) => (statusEl.textContent = t);

    // ---- Token dropdown -----------------------------------------------------
    // List image tokens on the CHARACTER layer so the player can pick theirs.
    async function refreshTokens() {
      const items = await OBR.scene.items.getItems(
        (i) => i.layer === "CHARACTER" && i.type === "IMAGE"
      );
      const previous = select.value;
      select.innerHTML = "";
      for (const item of items) {
        const opt = document.createElement("option");
        opt.value = item.id;
        opt.textContent = item.name || `Token ${item.id.slice(0, 6)}`;
        select.appendChild(opt);
      }
      if (items.some((i) => i.id === previous)) select.value = previous;
      if (!items.length) setStatus("No tokens found in this scene.");
    }

    // ---- Applying frames to tokens (runs on every client) ------------------
    async function applyFrame(tokenId, frame) {
      if (busy.has(tokenId)) return; // previous update still pending: skip this frame
      busy.add(tokenId);
      try {
        await OBR.scene.items.updateItems([tokenId], (items) => {
          for (const item of items) {
            if (item.type !== "IMAGE") continue;
            // Remember the real artwork once, so we can restore it when streaming stops.
            if (!originalUrls.has(item.id)) originalUrls.set(item.id, item.image.url);
            item.image.url = frame; // <- the Base64 data URL swap
          }
        });
      } catch (e) {
        console.warn("updateItems failed", e);
      } finally {
        busy.delete(tokenId);
      }
    }

    async function restoreToken(tokenId) {
      const url = originalUrls.get(tokenId);
      if (!url) return;
      originalUrls.delete(tokenId);
      await OBR.scene.items.updateItems([tokenId], (items) => {
        for (const item of items) if (item.type === "IMAGE") item.image.url = url;
      });
    }

    // ---- Receiving frames from other players -------------------------------
    OBR.onReady(() => {
      myId = OBR.player.id;

      OBR.broadcast.onMessage(CHANNEL, (event) => {
        const { playerId, tokenId, frame, stop } = event.data;
        if (playerId === myId) return; // ignore anything that is somehow our own
        if (stop) restoreToken(tokenId);
        else if (frame) applyFrame(tokenId, frame);
      });

      // Keep the dropdown in sync with the scene.
      OBR.scene.isReady().then((ready) => ready && refreshTokens());
      OBR.scene.onReadyChange((ready) => ready && refreshTokens());
      OBR.scene.items.onChange(() => {
        if (!stream) refreshTokens(); // don't reshuffle the list mid-stream
      });
    });

    // ---- Sending: capture loop ---------------------------------------------
    function captureAndSend() {
      if (video.readyState < 2) return; // video not ready yet

      // Centre-crop the webcam frame to a square, then scale down to SIZE x SIZE.
      const vw = video.videoWidth, vh = video.videoHeight;
      const side = Math.min(vw, vh);
      ctx.drawImage(video, (vw - side) / 2, (vh - side) / 2, side, side, 0, 0, SIZE, SIZE);

      // Low-quality JPEG -> Base64 data URL (a few KB per frame).
      const frame = canvas.toDataURL("image/jpeg", QUALITY);

      // Broadcast to everyone else in the room, tagged with our player ID.
      OBR.broadcast.sendMessage(CHANNEL, { playerId: myId, tokenId: activeTokenId, frame });

      // Broadcast doesn't echo back to the sender, so update our own view directly.
      applyFrame(activeTokenId, frame);
    }

    async function startCamera() {
      if (!select.value) return setStatus("Pick a token first.");
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: SIZE }, height: { ideal: SIZE }, frameRate: { ideal: FPS } },
          audio: false,
        });
      } catch (e) {
        return setStatus("Camera error: " + e.message);
      }
      video.srcObject = stream;
      await video.play();

      activeTokenId = select.value;
      select.disabled = true;
      timer = setInterval(captureAndSend, 1000 / FPS);
      btn.textContent = "Stop Camera";
      btn.classList.add("live");
      setStatus("Live: streaming at " + FPS + " fps");
    }

    async function stopCamera() {
      clearInterval(timer);
      timer = null;
      stream?.getTracks().forEach((t) => t.stop());
      stream = null;
      video.srcObject = null;

      // Tell everyone to put the original artwork back, and do it locally too.
      OBR.broadcast.sendMessage(CHANNEL, { playerId: myId, tokenId: activeTokenId, stop: true });
      await restoreToken(activeTokenId);

      activeTokenId = null;
      select.disabled = false;
      btn.textContent = "Start Camera";
      btn.classList.remove("live");
      setStatus("Camera stopped.");
      refreshTokens();
    }

    btn.addEventListener("click", () => (stream ? stopCamera() : startCamera()));
  </script>
</body>
</html>
