<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webcam Tokens</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 12px; color: #fff; background: #222639; }
    label { display: block; font-size: 12px; margin-bottom: 4px; opacity: .8; }
    select, button { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 6px; border: 0; font-size: 14px; }
    button { background: #bb99ff; color: #222639; font-weight: bold; cursor: pointer; }
    button.live { background: #ff6b6b; }
    #status { font-size: 12px; opacity: .8; min-height: 16px; }
  </style>
</head>
<body>
  <label for="tokenSelect">Select My Token</label>
  <select id="tokenSelect"></select>

  <button id="camBtn">Start Camera</button>
  <div id="status"></div>

  <script type="module">
    // The SDK ships as an ES module; this CDN build works in a plain <script type="module"> tag.
    import OBR, { buildImage } from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";

    // ---- Config -------------------------------------------------------------
    const CHANNEL = "com.example.webcam-tokens/frame"; // broadcast channel name
    const SIZE = 128;      // capture resolution (SIZE x SIZE)
    const FPS = 10;        // frames per second
    const QUALITY = 0.3;   // JPEG quality (0-1); low = small messages = low latency

    // ---- DOM ----------------------------------------------------------------
    const select = document.getElementById("tokenSelect");
    const btn = document.getElementById("camBtn");
    const statusEl = document.getElementById("status");
    const setStatus = (t) => (statusEl.textContent = t);

    // ---- State --------------------------------------------------------------
    let myId = null;          // this player's Owlbear ID
    let popup = null;         // the camera pop-out window
    let watchTimer = null;    // polls whether the pop-out was closed
    let activeTokenId = null; // token currently being streamed
    let received = 0;         // frames received from the pop-out (diagnostics)
    let applied = 0;          // frames drawn on a token (diagnostics)
    let reported = false;     // only show the first error
    const overlays = new Map();     // tokenId -> id of the local webcam overlay item
    const busy = new Map();         // tokenId -> time the in-flight update started

    // ---- Token dropdown -----------------------------------------------------
    async function refreshTokens() {
      const items = await OBR.scene.items.getItems(
        (i) => i.layer === "CHARACTER" && i.type === "IMAGE"
      );
      const previous = select.value;
      select.innerHTML = "";
      for (const item of items) {
        const opt = document.createElement("option");
        opt.value = item.id;
        opt.textContent = item.name || `Token ${item.id.slice(0, 6)}`;
        select.appendChild(opt);
      }
      if (items.some((i) => i.id === previous)) select.value = previous;
      if (!items.length) setStatus("No tokens found in this scene.");
    }

    // ---- Drawing frames (runs on every client) -----------------------------
    // Owlbear rejects Base64 images on SHARED items, so we don't edit the real token.
    // Instead each client adds a LOCAL image item (never synced, so no limits) that is
    // attached to the token: it follows the token's moves, rotation and scale.
    async function showFrame(tokenId, frame) {
      // Skip this frame if the previous one is still in flight (unless it hung for 3s).
      if (busy.has(tokenId) && Date.now() - busy.get(tokenId) < 3000) return;
      busy.set(tokenId, Date.now());
      try {
        const overlayId = overlays.get(tokenId);
        if (!overlayId) {
          // First frame: create the overlay using the token's own size/position/scale.
          const [token] = await OBR.scene.items.getItems([tokenId]);
          if (!token || token.type !== "IMAGE") return;
          const overlay = buildImage(
            { width: token.image.width, height: token.image.height, mime: "image/jpeg", url: frame },
            { dpi: token.grid.dpi, offset: token.grid.offset }
          )
            .name("Webcam")
            .position(token.position)
            .rotation(token.rotation)
            .scale(token.scale)
            .layer("ATTACHMENT")
            .attachedTo(tokenId)
            .locked(true)
            .disableHit(true) // clicks pass through to the real token
            .build();
          await OBR.scene.local.addItems([overlay]);
          overlays.set(tokenId, overlay.id);
        } else {
          // Later frames: just swap the picture on the existing overlay.
          await OBR.scene.local.updateItems([overlayId], (items) => {
            for (const item of items) if (item.type === "IMAGE") item.image.url = frame;
          });
        }
        applied++;
      } catch (e) {
        overlays.delete(tokenId); // overlay may be gone; recreate on the next frame
        if (!reported) {
          reported = true;
          const reason = e?.error?.message || e?.message || JSON.stringify(e);
          setStatus("Overlay failed: " + (e?.error?.name || e?.name || "") + " " + reason);
          console.error("overlay failed:", e);
        }
      } finally {
        busy.delete(tokenId);
      }
    }

    async function removeOverlay(tokenId) {
      const overlayId = overlays.get(tokenId);
      if (!overlayId) return;
      overlays.delete(tokenId);
      try { await OBR.scene.local.deleteItems([overlayId]); } catch (e) { /* already gone */ }
    }

    // ---- Receiving frames from other players -------------------------------
    OBR.onReady(() => {
      myId = OBR.player.id;

      OBR.broadcast.onMessage(CHANNEL, (event) => {
        const { playerId, tokenId, frame, stop } = event.data;
        if (playerId === myId) return;
        if (stop) removeOverlay(tokenId);
        else if (frame) showFrame(tokenId, frame);
      });

      OBR.scene.isReady().then((ready) => ready && refreshTokens());
      OBR.scene.onReadyChange((ready) => ready && refreshTokens());
      OBR.scene.items.onChange(() => {
        if (!popup) refreshTokens(); // don't reshuffle the list mid-stream
      });
    });

    // ---- Relay: pop-out window -> everyone else ----------------------------
    // The pop-out window captures the webcam and posts each frame here.
    window.addEventListener("message", (e) => {
      if (!popup || e.source !== popup) return; // only trust our own pop-out
      const msg = e.data;
      if (!msg) return;

      if (msg.type === "ready") {
        // Pop-out loaded: tell it our capture settings.
        popup.postMessage({ type: "config", size: SIZE, fps: FPS, quality: QUALITY }, "*");
      } else if (msg.type === "frame" && activeTokenId) {
        received++;
        if (received % 20 === 0 && !reported) {
          setStatus(`Live. Frames sent: ${received}, drawn: ${applied}`);
        }
        // Broadcast to everyone else, tagged with our player ID...
        OBR.broadcast.sendMessage(CHANNEL, { playerId: myId, tokenId: activeTokenId, frame: msg.frame });
        // ...broadcast doesn't echo back to us, so draw our own view directly.
        showFrame(activeTokenId, msg.frame);
      }
    });

    // ---- Start / stop -------------------------------------------------------
    function openCamera() {
      if (!select.value) return setStatus("Pick a token first.");
      activeTokenId = select.value;
      received = 0; applied = 0; reported = false;

      // Must be called directly from the click so the browser allows the popup.
      popup = window.open(
        new URL("camera.html", location.href).href,
        "obr-webcam",
        "width=280,height=360"
      );
      if (!popup) {
        activeTokenId = null;
        return setStatus("Popup blocked. Allow popups for this site and try again.");
      }

      select.disabled = true;
      btn.textContent = "Stop Camera";
      btn.classList.add("live");
      setStatus("Camera window opened. Click Start Camera in it.");

      // Closing the pop-out window = stop.
      watchTimer = setInterval(() => {
        if (popup.closed) stopStreaming();
      }, 1000);
    }

    async function stopStreaming() {
      clearInterval(watchTimer);
      watchTimer = null;
      if (popup && !popup.closed) popup.close();
      popup = null;

      // Tell everyone to remove the overlay (the real token was never changed).
      if (activeTokenId) {
        OBR.broadcast.sendMessage(CHANNEL, { playerId: myId, tokenId: activeTokenId, stop: true });
        await removeOverlay(activeTokenId);
      }
      activeTokenId = null;
      select.disabled = false;
      btn.textContent = "Start Camera";
      btn.classList.remove("live");
      setStatus("Camera stopped.");
      refreshTokens();
    }

    btn.addEventListener("click", () => (popup ? stopStreaming() : openCamera()));
  </script>
</body>
</html>
